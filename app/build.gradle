plugins { id 'com.android.application' }

android {
    namespace 'cl.rutaviajera.app'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'cl.rutaviajera.app'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.10.0'
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true; checkReleaseBuilds true }
}
